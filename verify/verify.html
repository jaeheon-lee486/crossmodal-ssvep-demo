<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-modal SSVEP verifier</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --mut: #6b6b70; --ok: #1a7f37; --bad: #c62828; --line: #e3e3e6; --code: #f4f4f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #e8e8ea; --mut: #9a9aa2; --ok: #4ac26b; --bad: #ff6b6b; --line: #2a2a2e; --code: #1b1b1f; }
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; padding: 24px 16px 60px; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .mut { color: var(--mut); }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; overflow-x: auto; display: block; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
  pre, code { background: var(--code); border-radius: 4px; }
  pre { padding: 10px; overflow-x: auto; font-size: 12px; }
  #summary { font-size: 18px; margin: 16px 0; padding: 12px; border: 2px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<main>
<h1>Cross-modal SSVEP &mdash; parity &amp; design verifier</h1>
<p class="mut">Runs the real <code>web/js</code> code. No display, no participant. Mirrors
<code>matlab/verifyDesign.m</code>; both compare against the golden fixture written by
<code>reference/reference_design.py</code>.</p>
<div id="summary">running&hellip;</div>
<div id="out"></div>
</main>

<script src="../js/config.js"></script>
<script src="../js/rng.js"></script>
<script src="../js/design.js"></script>
<script src="../js/stim.js"></script>
<script src="../../reference/golden_trials_seed12345.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.XMConfig, D = window.XMDesign, S = window.XMStim;
  var out = document.getElementById('out');
  var nPass = 0, nFail = 0;

  function head(t) { var h = document.createElement('h2'); h.textContent = t; out.appendChild(h); }
  function para(html) { var p = document.createElement('p'); p.innerHTML = html; out.appendChild(p); }
  function report(label, ok, detail) {
    ok ? nPass++ : nFail++;
    para('<span class="' + (ok ? 'ok">PASS' : 'bad">FAIL') + '</span> &nbsp;' + label +
         (detail ? ' <span class="mut">&mdash; ' + detail + '</span>' : ''));
  }
  function safe(label, fn) {
    try { fn(); } catch (e) { report(label, false, 'threw: ' + e.message); }
  }
  function close(a, b) { return Math.abs(a - b) < 1e-9; }
  function copy(x) { return JSON.parse(JSON.stringify(x)); }
  function rejects(list, pattern) {
    try { D.assertTrialList(list); } catch (e) { return pattern.test(e.message); }
    return false;
  }

  /* ------------------------------------------------ 1. parity */
  head('1. Trial list vs golden fixture (seed ' + (window.XM_GOLDEN ? window.XM_GOLDEN.seed : '?') + ', default design settings)');
  var trials = null;
  safe('golden comparison', function () {
    if (!window.XM_GOLDEN) { report('golden fixture loaded', false, 'reference/golden_trials_seed12345.js missing'); return; }
    report('parity id matches', window.XM_GOLDEN.parityId === CFG.PARITY_ID,
           'config ' + CFG.PARITY_ID + ', golden ' + window.XM_GOLDEN.parityId);
    var r = D.generateTrialList(window.XM_GOLDEN.seed);
    trials = r.trials;
    var csv = D.toCsv(trials);
    var same = csv === window.XM_GOLDEN.csv;
    var detail = trials.length + ' trials, ' + csv.length + ' bytes';
    if (!same) {
      var a = csv.split('\n'), b = window.XM_GOLDEN.csv.split('\n');
      for (var i = 0; i < Math.max(a.length, b.length); i++) {
        if (a[i] !== b[i]) { detail = 'first difference at line ' + (i + 1) + ':<br><code>js:  ' + a[i] +
                             '</code><br><code>ref: ' + b[i] + '</code>'; break; }
      }
    }
    report('generated CSV is byte-identical to the Python reference', same, detail);
    para('Block order: ' + r.blockTypes.join(' '));
  });

  /* ------------------------------------------------ 2. design audit */
  head('2. Design audit');
  safe('assertTrialList', function () {
    D.assertTrialList(trials);
    report('assertTrialList passes (block types and composition, burst-count distribution, all bursts of a trial ' +
           'in one array -- the cued one in attend-one cells, A/B balanced per burst count in attend-both cells -- ' +
           'eligibility, >= 1.0 s target spacing, tilt signs, ITI, dir_A != dir_B)', true);
  });
  safe('per-cell table', function () {
    var rows = '<tr><th>cell</th><th>condition</th><th>block type</th><th>trials</th>' +
               '<th>0 / 1 / 2 / 3 bursts</th><th>trials with bursts in A / in B</th><th>A bursts</th><th>B bursts</th></tr>';
    var allOk = true, wantN = { 1: 100, 2: 100, 3: 100, 4: 50, 5: 50 };
    CFG.CELLS.forEach(function (c) {
      var ct = trials.filter(function (t) { return t.cell === c.code; });
      var sa = 0, sb = 0, ta = 0, tb = 0, both = 0, hist = [0, 0, 0, 0], lvA = [0, 0, 0, 0], lvB = [0, 0, 0, 0];
      ct.forEach(function (t) {
        sa += t.n_tgt_A; sb += t.n_tgt_B; hist[t.n_tgt_A + t.n_tgt_B]++;
        if (t.n_tgt_A) { ta++; lvA[t.n_tgt_A]++; }
        if (t.n_tgt_B) { tb++; lvB[t.n_tgt_B]++; }
        if (t.n_tgt_A && t.n_tgt_B) { both++; }
      });
      var wantHist = [0, 0.9 * wantN[c.code], 0.1 * wantN[c.code], 0];
      var arrOk = c.attend === 'A' ? tb === 0 : c.attend === 'B' ? ta === 0
        : [1, 2, 3].every(function (v) { return Math.abs(lvA[v] - lvB[v]) <= 1; });
      if (ct.length !== wantN[c.code] || hist.join() !== wantHist.join() || !arrOk || both) { allOk = false; }
      rows += '<tr><td>' + c.code + '</td><td>' + c.name + '</td><td>' + c.blockType + '</td><td>' + ct.length +
              '</td><td>' + hist.join(' / ') + '</td><td>' + ta + ' / ' + tb + '</td><td>' + sa + '</td><td>' + sb + '</td></tr>';
    });
    out.insertAdjacentHTML('beforeend', '<table>' + rows + '</table>');
    var nOne = 0;
    for (var b = 1; b <= CFG.N_BLOCKS; b++) {
      var bt = trials.filter(function (t) { return t.block === b; });
      if (bt[0].block_type === 'one') { nOne++; }
      bt.forEach(function (t) { if (t.block_type === 'one' && t.sound_match !== 'none') { allOk = false; } });
    }
    report('defaults: 400 trials = 20 blocks x 20 (10 attend-one, 10 attend-both); cells 100 / 100 / 100 / 50 / 50; ' +
           'bursts per trial exactly 90 % one, 10 % two in every cell; no trial with bursts in both arrays; ' +
           'attend-one cells only in the cued array; attend-both cells A/B within 1 per burst count; ' +
           'no sound in any attend-one block', allOk && nOne === 10 && trials.length === 400, nOne + ' attend-one blocks');
  });
  safe('negative: dir', function () {
    var bad = copy(trials);
    bad[0].dir_B = bad[0].dir_A;
    report('a trial list with dir_A == dir_B is REJECTED', rejects(bad, /dir_A == dir_B/));
  });
  safe('negative: spacing', function () {
    var bad = copy(trials), t = null, i;
    for (i = 0; i < bad.length; i++) { if (bad[i].n_tgt_A + bad[i].n_tgt_B === 2) { t = bad[i]; break; } }
    if (t.n_tgt_A === 2) { t.tgt_A_pulses = [7, 8]; }                   // 126 / 144 ticks
    else if (t.n_tgt_B === 2) { t.tgt_B_pulses = [8, 9]; }              // 121 / 136 ticks
    else { t.tgt_A_pulses = [4]; t.tgt_B_pulses = [5]; }                // 72 / 76 ticks
    report('two targets closer than 1.0 s are REJECTED', rejects(bad, /ticks apart/));
  });
  safe('negative: sound in attend-one block', function () {
    var bad = copy(trials), t = bad.filter(function (x) { return x.block_type === 'one'; })[0];
    t.cell = 4; t.cond = 'attend_both_soundA'; t.attend = 'both'; t.sound_match = 'A';
    report('a sound trial inside an attend-one block is REJECTED', rejects(bad, /block \d+ \(one\): \d+ trials of cell/));
  });
  safe('negative: distractor burst', function () {
    var bad = copy(trials), t = bad.filter(function (x) { return x.cell === 1 && x.n_tgt_A === 1; })[0];
    t.n_tgt_A = 0; t.tgt_A_pulses = []; t.tgt_A_tilt_sign = []; t.tgt_A_onset_ticks = [];
    t.n_tgt_B = 1; t.tgt_B_pulses = [4]; t.tgt_B_tilt_sign = [1]; t.tgt_B_onset_ticks = [61];
    report('a burst in the UNCUED colour of an attend-one trial is REJECTED', rejects(bad, /uncued array B/));
  });
  safe('negative: bursts in both arrays', function () {
    var bad = copy(trials), t = bad.filter(function (x) { return x.cell === 3 && x.n_tgt_A === 2; })[0];
    t.n_tgt_A = 1; t.tgt_A_pulses = [4]; t.tgt_A_tilt_sign = [1]; t.tgt_A_onset_ticks = [72];
    t.n_tgt_B = 1; t.tgt_B_pulses = [14]; t.tgt_B_tilt_sign = [1]; t.tgt_B_onset_ticks = [211];
    report('a trial with bursts in BOTH arrays is REJECTED', rejects(bad, /bursts in both arrays/));
  });
  safe('negative: burst distribution', function () {
    var bad = copy(trials), t = bad.filter(function (x) { return x.n_tgt_A === 1 && x.n_tgt_B === 0; })[0];
    t.n_tgt_A = 0; t.tgt_A_pulses = []; t.tgt_A_tilt_sign = []; t.tgt_A_onset_ticks = [];
    report('a list whose bursts-per-trial counts differ from the distribution is REJECTED',
           rejects(bad, /bursts-per-trial counts/));
  });
  safe('practice', function () {
    var pr = D.practiceTrials(D.generateTrialList(window.XM_GOLDEN.seed + CFG.PRACTICE_SEED_OFFSET).trials, CFG.PRACTICE_N);
    var types = pr.map(function (t) { return t.block_type; }).join(' ');
    report('practice: first 3 trials of an attend-one block, then 3 of an attend-both block, renumbered in block 0',
           types === 'one one one both both both' && pr.every(function (t, i) { return t.block === 0 && t.trial === i + 1; }),
           pr.map(function (t) { return t.cond; }).join(', '));
  });

  /* ------------------------------------------------ 3. frequency plan */
  head('3. Frequency plan &mdash; the integer-harmonic relationship');
  safe('plan table', function () {
    var rates = [60, 75, 85, 90, 100, 120, 144, 165, 180, 240];
    var expectOk = { standard: [120, 240], fallback60: [60, 120, 180, 240] };
    var rows = '<tr><th>plan</th><th>refresh</th><th>result</th><th>A flicker</th><th>A pulse</th><th>B flicker</th><th>B pulse</th></tr>';
    var allMatch = true;
    Object.keys(CFG.FREQ_PLANS).forEach(function (name) {
      rates.forEach(function (R) {
        var r = D.planCheck(name, R), p = r.plan;
        var want = expectOk[name].indexOf(R) >= 0;
        if (!!p !== want) { allMatch = false; }
        rows += '<tr><td>' + name + '</td><td>' + R + ' Hz</td><td class="' + (p ? 'ok">OK' : 'bad">' +
                r.errors[0].split(' ')[0]) + '</td>' +
          (p ? '<td>' + p.A.flickerHz.toFixed(4) + ' Hz (' + p.A.flickerFrames + ' fr, ' + p.A.onFrames + ' on)</td>' +
               '<td>' + p.A.pulseHz.toFixed(4) + ' Hz (' + p.A.pulseFrames + ' fr) &times;' + p.A.harmonic + '</td>' +
               '<td>' + p.B.flickerHz.toFixed(4) + ' Hz (' + p.B.flickerFrames + ' fr, ' + p.B.onFrames + ' on)</td>' +
               '<td>' + p.B.pulseHz.toFixed(4) + ' Hz (' + p.B.pulseFrames + ' fr) &times;' + p.B.harmonic + '</td>'
             : '<td colspan="4" class="mut">' + r.errors[0] + '</td>') + '</tr>';
      });
    });
    out.insertAdjacentHTML('beforeend', '<table>' + rows + '</table>');
    report('plans are valid at exactly the expected refresh rates (standard: 120, 240; fallback60: 60, 120, 180, 240)', allMatch);
  });
  safe('standard @ 120 exact values', function () {
    var p = D.frequencyPlan('standard', 120);
    var ok = p.A.flickerFrames === 9 && p.A.pulseFrames === 36 && p.B.flickerFrames === 10 && p.B.pulseFrames === 30 &&
             close(p.A.flickerHz, 40 / 3) && close(p.A.pulseHz, 10 / 3) && close(p.B.flickerHz, 12) && close(p.B.pulseHz, 4) &&
             close(p.A.flickerHz, 4 * p.A.pulseHz) && close(p.B.flickerHz, 3 * p.B.pulseHz) &&
             p.stimFrames === 540 && p.stimFrames % 36 === 0 && p.stimFrames % 30 === 0;
    report('standard @ 120 Hz: A 9/36 frames = 13.333/3.333 Hz (x4), B 10/30 frames = 12/4 Hz (x3), 540-frame (4.5 s) epoch', ok);
    para('Shared harmonics (both arrays&rsquo; series, &le; ' + CFG.SHARED_HARMONIC_REPORT_MAX_HZ + ' Hz): ' +
         p.sharedHarmonics.map(function (s) { return s.hz + ' Hz [' + s.label + ']'; }).join(', '));
  });
  safe('negative: 60 Hz', function () {
    var r = D.planCheck('standard', 60);
    report('standard plan is REFUSED at 60 Hz (R3: 13.33 Hz would need 4.5 frames/cycle)',
           !r.plan && /^R3/.test(r.errors[0]), r.errors[0]);
    var thrown = false;
    try { D.frequencyPlan('standard', 60); } catch (e) { thrown = /FREQUENCY PLAN VIOLATION/.test(e.message); }
    report('frequencyPlan() throws on that violation (this is what stops a session)', thrown);
  });
  safe('negative: declared/derived mismatch', function () {
    CFG.FREQ_PLANS._test_mismatch = { harm: { A: 4, B: 3 }, flickerHz: { A: 13.33, B: 12 } };
    var r = D.planCheck('_test_mismatch', 120);
    delete CFG.FREQ_PLANS._test_mismatch;
    report('a plan whose declared 13.33 Hz is not the exact 40/3 is REJECTED (R4)',
           !r.plan && r.errors.some(function (e) { return /^R4/.test(e); }), r.errors[0]);
  });
  safe('negative: cross-array collision', function () {
    CFG.FREQ_PLANS._test_collide = { harm: { A: 4, B: 5 }, flickerHz: { A: 40 / 3, B: 20 } };
    var r = D.planCheck('_test_collide', 120);
    delete CFG.FREQ_PLANS._test_collide;
    report('a B flicker of 20 Hz (= 6 x A pulse) is REJECTED (R7)',
           !r.plan && r.errors.some(function (e) { return /^R7/.test(e); }), r.errors[0]);
  });

  /* ------------------------------------------------ 3b. setup settings */
  head('3b. Setup settings &mdash; validation, defaults, duty cycle');
  /* [bg, deviant coh, duty, speed, deviant speed, lum dip, tilt, expected first rule or null];
   * same cases as reference_design.py and verifyDesign.m */
  var vcases = [
    [50, 95, 50, 5, 5, 0, 0, null], [25, 55, 100 / 3, 5, 10, 0, 0, null], [0, 100, 1, 0.5, 40, 0, 0, null],
    [-1, 80, 100, 5, 5, 0, 0, 'V2'], [60, 101, 100, 5, 5, 0, 0, 'V2'],
    [60, 80, 0, 5, 5, 0, 0, 'V3'], [60, 80, 120, 5, 5, 0, 0, 'V3'],
    [80, 60, 100, 5, 5, 30, 0, 'V4'], [NaN, 80, 100, 5, 5, 0, 0, 'V1'],
    [50, 95, 50, 0, 5, 0, 0, 'V5'], [50, 95, 50, 5, 41, 0, 0, 'V5'], [50, 95, 50, 5, NaN, 0, 0, 'V1'],
    [70, 70, 100, 5, 5, 0, 0, 'V6'], [50, 50.3, 50, 5, 5, 0, 0, 'V6'], [0, 0, 50, 5, 10, 0, 30, 'V6'],
    [50, 50, 50, 5, 5, 30, 0, null], [50, 50, 50, 5, 5, 0, 30, null], [50, 50, 50, 5, 10, 0, 0, null],
    [50, 95, 50, 5, 10, 30, 30, null],
    [50, 50, 50, 5, 5, -1, 0, 'V7'], [50, 50, 50, 5, 5, 101, 0, 'V7'],
    [50, 50, 50, 5, 5, 0, -5, 'V8'], [50, 50, 50, 5, 5, 0, 91, 'V8'], [50, 50, 50, 5, 5, 0, 90, null],
    [50, 95, 50, 5, 5, NaN, 0, 'V1']
  ];
  safe('validation cases', function () {
    var allOk = true, rows = [];
    vcases.forEach(function (c) {
      var e = D.validateStimParams({ cohBgPct: c[0], cohTgtPct: c[1], dutyPct: c[2], speedDegS: c[3], burstSpeedDegS: c[4],
                                     lumDipPct: c[5], tiltDeg: c[6], resetMotion: false });
      var got = e.length ? e[0].slice(0, 2) : null;
      if (got !== c[7]) { allOk = false; }
      rows.push(c[0] + '/' + c[1] + '/' + (+c[2].toFixed(3)) + '/' + c[3] + '/' + c[4] + '/' + c[5] + '/' + c[6] +
                ' &rarr; ' + (got || 'ok'));
    });
    report('stimulus settings: validation accepts valid settings (each deviant layer alone and all four together) and ' +
           'rejects out-of-range, non-numeric, deviant coherence below background, bad speeds, luminance dip and tilt ' +
           'outside 0&ndash;100 % / 0&ndash;90&deg;, and a deviant identical to a background pulse (25 cases)',
           allOk, rows.join(', '));
  });
  /* [burst % for 0..3, attend-one blocks, sound-on %, expected first rule or null] */
  var dcases = [
    [[0, 90, 10, 0], 10, 50, null], [[25, 25, 25, 25], 0, 0, null], [[0, 0, 0, 100], 20, 100, null],
    [[100 / 3, 100 / 3, 100 / 3, 0], 10, 50, null], [[0, 90, 10, 1], 10, 50, 'D3'], [[0, 90, 20, -10], 10, 50, 'D2'],
    [[0, 90, 10, 0], 10, 101, 'D4'], [[0, 90, 10, 0], 10.5, 50, 'D5'], [[0, 90, 10, 0], 21, 50, 'D5'],
    [[0, 90, NaN, 0], 10, 50, 'D1']
  ];
  safe('design cases', function () {
    var allOk = true, rows = [];
    dcases.forEach(function (c) {
      var e = D.validateDesignParams({ burstPct: c[0], nOneBlocks: c[1], soundOnPct: c[2] });
      var got = e.length ? e[0].slice(0, 2) : null;
      if (got !== c[3]) { allOk = false; }
      rows.push('[' + c[0].map(function (v) { return +(+v).toFixed(2); }) + ']/' + c[1] + '/' + c[2] + ' &rarr; ' + (got || 'ok'));
    });
    report('design settings: validation accepts valid settings and rejects non-numbers, % out of range, ' +
           'burst % not adding to 100, sound-on out of range, a non-integer or too large block count (10 cases)',
           allOk, rows.join(', '));
    var m = D.burstCountMultiset(7, [25, 25, 25, 25]), h = [0, 0, 0, 0];
    m.forEach(function (v) { h[v]++; });
    report('burst counts by largest remainder: 7 trials at 25 / 25 / 25 / 25 % &rarr; 2 / 2 / 2 / 1',
           h.join() === '2,2,2,1', h.join(' / '));
  });
  safe('defaults', function () {
    report('defaults: background 50 %, target 95 %, duty 50 % (50 and 95 of 100 dots), speeds 5 / 5 &deg;/s, ' +
           '40 cm viewing distance, 60 cm screen width; luminance dip 0 (off), tilt 0 (off), reset off; ' +
           'bursts 0 / 90 / 10 / 0 %, 10 attend-one blocks, sound on 50 %',
           CFG.COH_BG_PCT_DEFAULT === 50 && CFG.COH_TGT_PCT_DEFAULT === 95 && CFG.DUTY_PCT_DEFAULT === 50 &&
           D.nCoherent(50, 100) === 50 && D.nCoherent(95, 100) === 95 &&
           CFG.DOT_SPEED_DEG_S_DEFAULT === 5 && CFG.BURST_SPEED_DEG_S_DEFAULT === 5 &&
           CFG.VIEW_DIST_CM_DEFAULT === 40 && CFG.SCREEN_WIDTH_CM_DEFAULT === 60 &&
           CFG.LUM_DIP_PCT_DEFAULT === 0 && CFG.TILT_DEG_DEFAULT === 0 && CFG.TASK_MODES === undefined &&
           CFG.RESET_MOTION_DEFAULT === false && CFG.BURST_PCT_DEFAULT.join() === '0,90,10,0' &&
           CFG.N_ONE_BLOCKS_DEFAULT === 10 && CFG.SOUND_ON_PCT_DEFAULT === 50);
  });
  safe('timing', function () {
    var itiOk = trials.every(function (t) { return t.iti_ticks >= 42 && t.iti_ticks <= 72; });
    report('trial timing: ITI 0.7&ndash;1.2 s (42&ndash;72 ticks, every trial in range), cue 0.8 s, gap 0.5 s, stimulus 4.5 s; ' +
           'targets 1.0&ndash;3.6 s, so every 0.15&ndash;0.90 s response window closes by stimulus end',
           itiOk && CFG.ITI_MIN_TICKS === 42 && CFG.ITI_JITTER_TICKS === 30 && CFG.CUE_TICKS === 48 &&
           CFG.GAP_TICKS === 30 && CFG.STIM_TICKS === 270 && CFG.TGT_MAX_ONSET_TICKS === 216 &&
           CFG.TGT_MAX_ONSET_TICKS + CFG.RESP_WIN_MAX_S * CFG.GRID_HZ <= CFG.STIM_TICKS,
           'eligible A ' + D.eligiblePulses('A').join(',') + ' | B ' + D.eligiblePulses('B').join(','));
  });
  safe('duty -> window', function () {
    var want = [[100, 36, 30], [50, 18, 15], [100 / 3, 12, 10], [10, 4, 3]], ok = true, det = [];
    want.forEach(function (w) {
      var p = D.frequencyPlan('standard', 120, w[0]);
      if (p.A.winFrames !== w[1] || p.B.winFrames !== w[2]) { ok = false; }
      det.push((+w[0].toFixed(3)) + '% &rarr; A ' + p.A.winFrames + ', B ' + p.B.winFrames);
    });
    report('coherent window = duty x pulse period, nearest frame (standard @ 120 Hz)', ok, det.join('; '));
    var r = D.planCheck('standard', 120, 1);
    report('a duty cycle too short for one frame (1 % of 36 frames) is REFUSED (R9)',
           !r.plan && r.errors.some(function (e) { return /^R9/.test(e); }), r.errors[0]);
  });
  safe('dimmed colour', function () {
    var a = S.dimmedColor([158, 0, 0], 30), b = S.dimmedColor([0, 0, 255], 30), c = S.dimmedColor([0, 0, 255], 100);
    report('luminance dip in linear light (sRGB): red [158 0 0] and blue [0 0 255] at 30 % &rarr; [134 0 0] and ' +
           '[0 0 218]; 100 % &rarr; black',
           a.join() === '134,0,0' && b.join() === '0,0,218' && c.join() === '0,0,0', a.join(' ') + ' | ' + b.join(' '));
  });

  /* ------------------------------------------------ 4. schedule + pips */
  head('4. Stimulus schedule and pip train (standard @ 120 Hz)');
  safe('continuous coherence', function () {
    var p = D.frequencyPlan('standard', 120, 100), s = D.stimulusSchedule(p), inA = 0, inB = 0, f, lastB = 0;
    for (f = 0; f < p.stimFrames; f++) { inA += s.A.pulse[f] >= 0 ? 1 : 0; inB += s.B.pulse[f] >= 0 ? 1 : 0; }
    for (f = 0; f < p.stimFrames; f++) { if (s.B.pulse[f] === 17) { lastB++; } }
    report('duty 100 %: every frame of A is coherent (540/540); B all but frames 0-1 before its first pulse ' +
           '(538/540); the last B pulse is cut at the epoch end (28 of 30 frames)',
           inA === 540 && inB === 538 && s.B.pulse[0] === -1 && s.B.pulse[1] === -1 && lastB === 28,
           'A ' + inA + ', B ' + inB + ', last B pulse ' + lastB + ' frames');
  });
  safe('schedule', function () {
    var p = D.frequencyPlan('standard', 120), s = D.stimulusSchedule(p);
    var onA = 0, onB = 0, f;
    for (f = 0; f < p.stimFrames; f++) { onA += s.A.on[f]; onB += s.B.on[f]; }
    var firstA = Array.prototype.slice.call(s.A.on, 0, 18).join('');
    var firstB = Array.prototype.slice.call(s.B.on, 0, 22).join('');
    report('A on-frames 300/540 (5 of every 9), B 270/540 (5 of every 10)', onA === 300 && onB === 270,
           'A ' + firstA + '&hellip;, B ' + firstB + '&hellip;');
    report('15 A pulses every 36 frames from frame 0; 18 B pulses every 30 frames from frame 2',
           s.A.onsetFrames.length === 15 && s.B.onsetFrames.length === 18 &&
           s.A.onsetFrames[14] === 504 && s.B.onsetFrames[0] === 2 && s.B.onsetFrames[17] === 512);
    report('every pulse starts on its own array\'s flicker ON edge (phase-locked)',
           s.A.onsetFrames.every(function (o) { return s.A.on[o] === 1 && (o === 0 || s.A.on[o - 1] === 0); }) &&
           s.B.onsetFrames.every(function (o) { return s.B.on[o] === 1 && s.B.on[o - 1] === 0; }));
    var ifi = 1 / 120;
    var pa = S.pipSchedule({ sound_match: 'A' }, s, ifi), pb = S.pipSchedule({ sound_match: 'B' }, s, ifi);
    var pn = S.pipSchedule({ sound_match: 'none' }, s, ifi);
    report('pips: 15 locked to A (every 0.300 s), 18 locked to B (every 0.250 s), none in silent trials; ' +
           'all inside the stimulus (first at 0 s / 0.017 s)',
           pa.length === 15 && pb.length === 18 && pn.length === 0 &&
           close(pa[1].t_s - pa[0].t_s, 0.3) && close(pb[1].t_s - pb[0].t_s, 0.25) &&
           pa[0].t_s >= 0 && pb[0].t_s >= 0 && pa[14].t_s < 4.5 && pb[17].t_s < 4.5);
    var smp = S.pipTrainSamples(pa.slice(0, 1), 0.1, 48000), peak = 0;
    for (f = 0; f < smp.length; f++) { peak = Math.max(peak, Math.abs(smp[f])); }
    report('pip waveform: ' + CFG.PIP_FREQ_HZ + ' Hz, ' + (CFG.PIP_DUR_S * 1000) + ' ms, peak ' + CFG.PIP_AMPLITUDE,
           Math.abs(peak - CFG.PIP_AMPLITUDE) < 0.005 && smp[0] === 0, 'measured peak ' + peak.toFixed(4));
  });

  /* ------------------------------------------------ 5. dots */
  head('5. Dot precomputation (synthetic geometry)');
  safe('dots', function () {
    var p = D.frequencyPlan('standard', 120), s = D.stimulusSchedule(p);
    var geom = S.makeGeometry(0.027, 60, 1 / 120);
    var t0 = performance.now();
    var d = S.precomputeDots(trials[0], p, s, geom);
    var ms = performance.now() - t0, R = geom.apertureRadiusPx, worst = 0;
    for (var i = 0; i < d.x.length; i++) { worst = Math.max(worst, Math.sqrt(d.x[i] * d.x[i] + d.y[i] * d.y[i])); }
    report('all ' + d.x.length + ' positions inside the ' + R.toFixed(1) + ' px aperture', worst <= R + 1e-9,
           'max radius ' + worst.toFixed(2) + ' px; precompute took ' + ms.toFixed(0) + ' ms');
    var seen = {};
    for (i = 0; i < d.drawOrder.length; i++) { seen[d.drawOrder[i]] = 1; }
    report('draw order is a permutation of all ' + d.nTot + ' dots', Object.keys(seen).length === d.nTot);
  });

  /* Count A dots whose step from frame f-1 to f is exactly the step of length
   * stepPx in direction angDeg; dots respawned on that frame can only lower
   * the count. Defaults (50 / 95 %, duty 50 %) but a deviant speed of
   * 10 deg/s, so the two speeds are told apart; over = further overrides. */
  function coherentCounts(over, reset) {
    var sp = D.defaultStimParams(), key;
    sp.burstSpeedDegS = 10;
    for (key in over) { sp[key] = over[key]; }
    sp.resetMotion = !!reset;
    var p = D.frequencyPlan('standard', 120, sp.dutyPct), s = D.stimulusSchedule(p);
    var geom = S.makeGeometry(0.027, 60, 1 / 120, sp), t = null, i;
    for (i = 0; i < trials.length; i++) { if (trials[i].n_tgt_A > 0 && trials[i].tgt_A_pulses[0] > 1) { t = trials[i]; break; } }
    var d = S.precomputeDots(t, p, s, geom, sp), N = d.nPerArray;
    var base = CFG.DIR_ANGLE_DEG[t.dir_A];
    function count(f, stepPx, angDeg) {
      var n = 0, a = angDeg * Math.PI / 180, cdx = stepPx * Math.cos(a), cdy = -stepPx * Math.sin(a);
      for (var j = 0; j < N; j++) {
        var dx = d.x[f * d.nTot + j] - d.x[(f - 1) * d.nTot + j], dy = d.y[f * d.nTot + j] - d.y[(f - 1) * d.nTot + j];
        if (Math.abs(dx - cdx) < 1e-6 && Math.abs(dy - cdy) < 1e-6) { n++; }
      }
      return n;
    }
    var kT = t.tgt_A_pulses[0], kB = kT - 1, vN = geom.speedPxPerFrame, vB = geom.burstSpeedPxPerFrame;
    return { t: t, d: d, s: s, p: p, N: N, sp: sp, geom: geom, kT: kT, kB: kB, vN: vN, vB: vB, base: base,
             sign: t.tgt_A_tilt_sign[0], count: count, inT: s.A.onsetFrames[kT] + 10, inB: s.A.onsetFrames[kB] + 10,
             outB: s.A.onsetFrames[kB] + 25 };
  }

  safe('deviant: coherence + speed', function () {
    var c = coherentCounts({});
    var nT = c.count(c.inT, c.vB, c.base), nTslow = c.count(c.inT, c.vN, c.base), nB = c.count(c.inB, c.vN, c.base);
    var nOut = c.count(c.outB, c.vN, c.base) + c.count(c.outB, c.vB, c.base);
    report('deviant coherence 95 % + speed 10 &deg;/s (trial ' + c.t.trial + ', duty 50 %): inside a deviant pulse 95 of ' +
           '100 A dots move coherently at the DEVIANT speed (none at the normal speed); inside a background pulse 50 at ' +
           'the normal speed; after the window, none',
           nT <= 95 && nT >= 88 && nTslow === 0 && nB <= 50 && nB >= 45 && nOut === 0,
           'deviant pulse ' + c.kT + ': ' + nT + ' at deviant speed, ' + nTslow + ' at normal; background pulse ' + c.kB +
           ': ' + nB + '; after window: ' + nOut + ' (respawns can lower the first two by a few)');
  });
  safe('deviant: motion layers off', function () {
    var c = coherentCounts({ cohTgtPct: 50, burstSpeedDegS: 5, lumDipPct: 30 });
    var t0 = JSON.parse(JSON.stringify(c.t));
    t0.tgt_A_pulses = []; t0.tgt_B_pulses = []; t0.tgt_A_tilt_sign = []; t0.tgt_B_tilt_sign = [];
    var d0 = S.precomputeDots(t0, c.p, c.s, c.geom, c.sp), same = true;
    for (var i = 0; i < d0.x.length; i++) { if (d0.x[i] !== c.d.x[i] || d0.y[i] !== c.d.y[i]) { same = false; break; } }
    report('deviant coherence and speed equal to the background, tilt 0 (luminance dip only): every dot position is ' +
           'IDENTICAL to the same trial with no deviant at all &mdash; not distinguishable by motion',
           same, 'compared ' + d0.x.length + ' positions');
  });
  safe('deviant: tilt only', function () {
    var c = coherentCounts({ cohTgtPct: 50, burstSpeedDegS: 5, tiltDeg: 30 });
    var tilted = c.base + c.sign * 30;
    var nT = c.count(c.inT, c.vN, tilted), nStraight = c.count(c.inT, c.vN, c.base), nB = c.count(c.inB, c.vN, c.base);
    report('tilt 30&deg; only: in a deviant pulse about 50 A dots move at the normal speed in the direction rotated by ' +
           'sign x 30&deg; (none in the untilted direction); background pulses are untilted',
           nT <= 50 && nT >= 44 && nStraight === 0 && nB <= 50 && nB >= 44,
           'deviant pulse ' + c.kT + ' (sign ' + c.sign + ', ' + tilted + '&deg;): ' + nT + ' tilted, ' + nStraight +
           ' straight; background pulse: ' + nB);
  });
  safe('deviant: all layers', function () {
    var c = coherentCounts({ tiltDeg: 30, lumDipPct: 30 });
    var tilted = c.base + c.sign * 30;
    var nT = c.count(c.inT, c.vB, tilted), nStraight = c.count(c.inT, c.vB, c.base) + c.count(c.inT, c.vN, tilted);
    report('coherence 95 % + speed 10 &deg;/s + tilt 30&deg; + dip 30 % together: about 95 A dots move at the deviant ' +
           'speed in the tilted direction (none untilted, none tilted at the normal speed)',
           nT <= 95 && nT >= 88 && nStraight === 0,
           'deviant pulse ' + c.kT + ' (sign ' + c.sign + '): ' + nT + ' fast + tilted, ' + nStraight + ' otherwise');
  });
  safe('reset motion', function () {
    function backCount(reset) {
      var c = coherentCounts({}, reset), o = c.s.A.onsetFrames[c.kB], W = c.p.A.winFrames, r = o + W, nT = c.d.nTot;
      var full = 0, back = 0;
      for (var j = 0; j < c.N; j++) {
        var allCoh = true;
        for (var f = o; f < o + W; f++) {
          var dx = c.d.x[f * nT + j] - c.d.x[(f - 1) * nT + j], dy = c.d.y[f * nT + j] - c.d.y[(f - 1) * nT + j];
          var a = c.base * Math.PI / 180;
          if (Math.abs(dx - c.vN * Math.cos(a)) > 1e-6 || Math.abs(dy + c.vN * Math.sin(a)) > 1e-6) { allCoh = false; break; }
        }
        if (!allCoh) { continue; }
        full++;
        var ex = c.d.x[r * nT + j] - c.d.x[(o - 1) * nT + j], ey = c.d.y[r * nT + j] - c.d.y[(o - 1) * nT + j];
        if (Math.abs(Math.sqrt(ex * ex + ey * ey) - c.vN) < 1e-6) { back++; }
      }
      return [full, back];
    }
    var on = backCount(true), off = backCount(false);
    report('reset motion: on the first frame after a coherent window, every dot that swept for the whole window is back ' +
           'at its pre-window position plus one ordinary step; with reset off, none is',
           on[0] >= 40 && on[1] >= on[0] - 3 && on[1] <= on[0] && off[0] >= 40 && off[1] === 0,
           'reset on: ' + on[1] + ' of ' + on[0] + ' back; reset off: ' + off[1] + ' of ' + off[0] +
           ' (a respawn on that frame can lower the first)');
  });

  /* ------------------------------------------------ 6. scoring */
  head('6. Response scoring (same cases as reference_design.py and verifyDesign.m)');
  var cases = [
    ['both: two hits', 'both', [['A', 1.2], ['B', 2.5]], [1.6, 2.9], 'hit|hit', 'hit|hit', '2,0,0,0,0'],
    ['attend A: B response', 'A', [['A', 1.2], ['B', 2.5]], [1.6, 3.0], 'hit|unattended_responded', 'hit|fa_unattended', '1,0,0,1,0'],
    ['attend B: early + none', 'B', [['A', 1.2]], [0.5, 1.3], 'unattended_ignored', 'fa|fa', '0,0,2,0,0'],
    ['both: double press', 'both', [['A', 2.4]], [2.8, 2.9], 'hit', 'hit|extra', '1,0,0,0,1'],
    ['both: too late = miss', 'both', [['A', 1.2]], [2.2], 'miss', 'fa', '0,1,1,0,0'],
    ['attend A: A missed', 'A', [['A', 1.2], ['B', 3.0]], [], 'miss|unattended_ignored', '', '0,1,0,0,0']
  ];
  cases.forEach(function (c) {
    safe(c[0], function () {
      var tg = c[2].map(function (t, i) { return { arr: t[0], pulse: i, onset_s: t[1] }; });
      var r = D.scoreTrial(tg, c[1], c[3]), s = r.summary;
      var got = [r.targetOutcomes.join('|'), r.responseOutcomes.join('|'),
                 [s.n_hits, s.n_misses, s.n_fa, s.n_fa_unattended, s.n_extra].join(',')];
      report(c[0], got[0] === c[4] && got[1] === c[5] && got[2] === c[6], got.join(' ; '));
    });
  });

  var sum = document.getElementById('summary');
  sum.innerHTML = nFail === 0
    ? '<span class="ok">ALL ' + nPass + ' CHECKS PASSED</span>'
    : '<span class="bad">' + nFail + ' FAILED</span>, ' + nPass + ' passed &mdash; do not run participants';
  sum.style.borderColor = nFail === 0 ? 'var(--ok)' : 'var(--bad)';
})();
</script>
</body>
</html>
